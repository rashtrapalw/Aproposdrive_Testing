server {
    listen 80;
    server_name _;

    # ALB / curl health probe
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Static assets — cache at browser
    location /static/ {
        proxy_pass http://127.0.0.1:5000;
        add_header Cache-Control "public, max-age=86400";
    }

    # office_relay.py connects here over WebSocket (RELAY_PORT=8765 in
    # remote_serial.py). Office relay should use wss://yourdomain/relay
    # once TLS is on (ALB/ACM or certbot), and EC2_RELAY_URL in
    # office_relay.py should be updated to match.
    location /relay {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;   # keep long-lived websocket alive
        proxy_send_timeout 3600s;
    }

    # Everything else → Flask
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
